services:
  - type: web
    name: worqo-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: APP_NAME
        value: Worqo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: worqo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: worqo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: worqo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: worqo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: worqo-db
          property: password
      - key: BROADCAST_DRIVER
        value: log
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      - key: REDIS_HOST
        value: 127.0.0.1
      - key: REDIS_PASSWORD
        value: null
      - key: REDIS_PORT
        value: 6379
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: mailhog
      - key: MAIL_PORT
        value: 1025
      - key: MAIL_USERNAME
        value: null
      - key: MAIL_PASSWORD
        value: null
      - key: MAIL_ENCRYPTION
        value: null
      - key: MAIL_FROM_ADDRESS
        value: noreply@worqo.com
      - key: MAIL_FROM_NAME
        value: "Worqo"

databases:
  - name: worqo-db
    plan: starter
    databaseName: worqo
    user: worqo_user

